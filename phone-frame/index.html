<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Frame Generator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='8' y='1' width='16' height='30' rx='4' fill='%23111'/><rect x='9.5' y='3' width='13' height='24' rx='2.5' fill='%230a84ff'/><rect x='13' y='28' width='6' height='1.5' rx='0.75' fill='%23333'/><rect x='13.5' y='2' width='5' height='1' rx='0.5' fill='%23333'/></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #252525;
      --border: #333;
      --text: #f0f0f0;
      --muted: #777;
      --accent: #0a84ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Stage (first on mobile) ── */
    #stage {
      order: 1;
    }

    /* ── Panel (below on mobile) ── */
    #panel {
      order: 2;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Desktop: side by side ── */
    @media (min-width: 860px) {
      body {
        flex-direction: row;
        height: 100vh;
        overflow: hidden;
      }
      #panel {
        order: 1;
        width: 300px;
        flex-shrink: 0;
        border-top: none;
        border-right: 1px solid var(--border);
        overflow-y: auto;
        height: 100vh;
      }
      #stage {
        order: 2;
        flex: 1;
        height: 100vh;
        overflow: hidden;
      }
    }

    #panel h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    #panel h1 small {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 2px;
    }

    .section { display: flex; flex-direction: column; gap: 8px; }

    .label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input[type="url"], input[type="text"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 11px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="url"]:focus, input[type="text"]:focus { border-color: var(--accent); }

    .upload-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
      transition: border-color 0.15s, color 0.15s;
    }
    .upload-btn:hover { border-color: var(--accent); color: var(--text); }
    input[type="file"] { display: none; }

    .or-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: var(--muted);
    }
    .or-divider::before, .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .range-row { display: flex; align-items: center; gap: 8px; }
    input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
    .range-val { font-size: 11px; color: var(--muted); min-width: 34px; text-align: right; }

    .color-row { display: flex; gap: 8px; }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s, transform 0.15s;
    }
    .swatch:hover { transform: scale(1.1); }
    .swatch.active { border-color: var(--accent); }
    .swatch-black  { background: linear-gradient(145deg, #2c2c2e, #111); }
    .swatch-white  { background: linear-gradient(145deg, #f5f5f7, #d8d8dc); }
    .swatch-teal   { background: linear-gradient(145deg, #5ac8c8, #2d8080); }
    .swatch-pink   { background: linear-gradient(145deg, #f2b8c6, #c8607a); }

    .btn {
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:active { opacity: 0.7; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost   { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
    .btn-record  { background: #ff3b30; color: #fff; }
    .btn-stop    { background: #636366; color: #fff; }

    .hr { height: 1px; background: var(--border); }

    .note { font-size: 10px; color: var(--muted); line-height: 1.6; }

    /* ── Stage ── */
    #stage {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.04) 1px, transparent 0);
      background-size: 28px 28px;
      padding: 24px 16px;
    }

    @media (min-width: 860px) {
      #stage {
        padding: 0;
        overflow: hidden;
      }
    }

    /* 9:16 story canvas — responsive width */
    #story {
      width: min(370px, calc(100vw - 32px));
      aspect-ratio: 9 / 16;
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      background: #111;
      box-shadow: 0 16px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    #bg-layer {
      position: absolute;
      inset: -5%;
      width: 110%;
      height: 110%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: filter 0.2s;
    }

    #vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #phone-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }

    /* ── iPhone 16 frame ── */
    :root { --phone-h: 447px; }

    .phone {
      width: 212px;
      height: var(--phone-h);
      position: relative;
      border-radius: 40px;
      padding: 5px;
      flex-shrink: 0;
      transition: height 0.25s ease, border-radius 0.25s ease;
    }

    /* Colors — iPhone 16 lineup */
    .phone.black {
      background: linear-gradient(160deg, #2a2a2c 0%, #181818 60%, #252527 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.12),
        0 0 0 2px rgba(0,0,0,0.8),
        0 32px 80px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.07);
    }
    .phone.white {
      background: linear-gradient(160deg, #f5f5f7 0%, #e2e2e5 60%, #f0f0f2 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.9),
        0 0 0 2px rgba(0,0,0,0.2),
        0 32px 80px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.8);
    }
    .phone.teal {
      background: linear-gradient(160deg, #6ecfcf 0%, #3a9898 60%, #5ababa 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.25),
        0 0 0 2px rgba(0,0,0,0.4),
        0 32px 80px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .phone.pink {
      background: linear-gradient(160deg, #f2b8c6 0%, #d4728a 60%, #e8a0b4 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.35),
        0 0 0 2px rgba(0,0,0,0.3),
        0 32px 80px rgba(0,0,0,0.65),
        inset 0 1px 0 rgba(255,255,255,0.2);
    }

    /* iPhone 16 buttons */
    /* Left side: Action button (top), Vol+, Vol- */
    .btn-action, .btn-vol-up, .btn-vol-down {
      position: absolute;
      left: -3px;
      width: 3px;
      border-radius: 2px 0 0 2px;
    }
    .btn-action   { top: calc(var(--phone-h) * 0.156);  height: calc(var(--phone-h) * 0.037); }
    .btn-vol-up   { top: calc(var(--phone-h) * 0.229);  height: calc(var(--phone-h) * 0.101); }
    .btn-vol-down { top: calc(var(--phone-h) * 0.353);  height: calc(var(--phone-h) * 0.101); }

    /* Right side: Power button (top), Camera Control (lower) */
    .btn-power, .btn-camera {
      position: absolute;
      right: -3px;
      width: 3px;
      border-radius: 0 2px 2px 0;
    }
    .btn-power  { top: calc(var(--phone-h) * 0.257);  height: calc(var(--phone-h) * 0.142); }
    .btn-camera { top: calc(var(--phone-h) * 0.546);  height: calc(var(--phone-h) * 0.083); }

    /* Button color per phone variant */
    .phone.black  .btn-action,
    .phone.black  .btn-vol-up,
    .phone.black  .btn-vol-down,
    .phone.black  .btn-power,
    .phone.black  .btn-camera  { background: #232325; }

    .phone.white  .btn-action,
    .phone.white  .btn-vol-up,
    .phone.white  .btn-vol-down,
    .phone.white  .btn-power,
    .phone.white  .btn-camera  { background: #c8c8cc; }

    .phone.teal   .btn-action,
    .phone.teal   .btn-vol-up,
    .phone.teal   .btn-vol-down,
    .phone.teal   .btn-power,
    .phone.teal   .btn-camera  { background: #2e8080; }

    .phone.pink   .btn-action,
    .phone.pink   .btn-vol-up,
    .phone.pink   .btn-vol-down,
    .phone.pink   .btn-power,
    .phone.pink   .btn-camera  { background: #c0607a; }

    /* Screen */
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 38px;
      overflow: hidden;
      background: #000;
      position: relative;
      transition: border-radius 0.25s ease;
    }

    #screen-img, #screen-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    /* Subtle glass glare */
    .screen-glare {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(255,255,255,0.06) 0%, transparent 40%);
      pointer-events: none;
      z-index: 20;
      border-radius: inherit;
    }

    /* Home indicator */
    .home-bar {
      position: absolute;
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 72px;
      height: 4px;
      background: rgba(255,255,255,0.28);
      border-radius: 2px;
      z-index: 15;
    }

    /* Recording pulse on stage */
    #rec-indicator {
      position: absolute;
      top: 10px;
      right: 10px;
      display: none;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,0.6);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      color: #ff3b30;
      z-index: 99;
    }
    #rec-indicator.visible { display: flex; }
    #rec-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #ff3b30;
      animation: rec-blink 1s ease-in-out infinite;
    }
    @keyframes rec-blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  </style>
</head>
<body>

<!-- ── Preview comes first in DOM for mobile ── -->
<div id="stage">
  <div id="story">
    <div id="bg-layer"></div>
    <div id="vignette"></div>

    <div id="phone-wrap">
      <div class="phone black" id="phone">
        <div class="btn-action"></div>
        <div class="btn-vol-up"></div>
        <div class="btn-vol-down"></div>
        <div class="btn-power"></div>
        <div class="btn-camera"></div>

        <div class="screen">
          <img id="screen-img" src="" alt="">
          <video id="screen-video" playsinline muted loop></video>
          <div class="home-bar"></div>
          <div class="screen-glare"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="rec-indicator"><div id="rec-dot"></div> REC</div>
</div>

<div id="panel">
  <div>
    <h1>Phone Frame
      <small>Instagram Story Generator</small>
    </h1>
  </div>

  <div class="section">
    <div class="label">Background Image</div>
    <label class="upload-btn" for="bg-file">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span id="bg-file-label">Upload image…</span>
    </label>
    <input type="file" id="bg-file" accept="image/*">
    <div class="or-divider">or</div>
    <input type="url" id="bg-url" placeholder="https://… (image URL)">
  </div>

  <div class="section">
    <div class="label">Background Blur</div>
    <div class="range-row">
      <input type="range" id="blur" min="0" max="40" value="0">
      <span class="range-val" id="blur-val">0px</span>
    </div>
  </div>

  <div class="section">
    <div class="label">Vignette</div>
    <div class="range-row">
      <input type="range" id="vig" min="0" max="100" value="0">
      <span class="range-val" id="vig-val">0%</span>
    </div>
  </div>

  <div class="hr"></div>

  <div class="section">
    <div class="label">Screen Content</div>
    <label class="upload-btn" for="screen-file">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      <span id="screen-file-label">Upload image or video…</span>
    </label>
    <input type="file" id="screen-file" accept="image/*,video/*">
    <div class="or-divider">or</div>
    <input type="url" id="screen-url" placeholder="https://… (image URL)">
  </div>

  <div class="section">
    <div class="label">Phone Color</div>
    <div class="color-row">
      <div class="swatch swatch-black active" data-color="black" title="Black"></div>
      <div class="swatch swatch-white"        data-color="white" title="White"></div>
      <div class="swatch swatch-teal"         data-color="teal"  title="Teal"></div>
      <div class="swatch swatch-pink"         data-color="pink"  title="Pink"></div>
    </div>
  </div>

  <div class="section">
    <div class="label">Phone Scale</div>
    <div class="range-row">
      <input type="range" id="scale" min="50" max="120" value="100">
      <span class="range-val" id="scale-val">100%</span>
    </div>
  </div>

  <button class="btn btn-primary" id="apply-btn">Apply</button>

  <div class="hr"></div>

  <div class="section">
    <button class="btn btn-ghost" id="dl-btn">⬇ Download PNG</button>
    <p class="note">Exports at 3× (1110 × 1974 px) — ready for Instagram Stories.</p>
  </div>

  <div class="section">
    <button class="btn btn-record" id="record-btn" disabled>⏺ Record Video</button>
    <p class="note" id="record-note">Upload a video to the phone screen to enable recording. Exports as WebM at 1080 × 1920.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
        integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
  const bgFile        = document.getElementById('bg-file');
  const bgUrl         = document.getElementById('bg-url');
  const bgFileLabel   = document.getElementById('bg-file-label');
  const screenFile    = document.getElementById('screen-file');
  const screenUrl     = document.getElementById('screen-url');
  const screenLabel   = document.getElementById('screen-file-label');
  const blurSlider    = document.getElementById('blur');
  const blurVal       = document.getElementById('blur-val');
  const vigSlider     = document.getElementById('vig');
  const vigVal        = document.getElementById('vig-val');
  const scaleSlider   = document.getElementById('scale');
  const scaleVal      = document.getElementById('scale-val');
  const applyBtn      = document.getElementById('apply-btn');
  const dlBtn         = document.getElementById('dl-btn');
  const recordBtn     = document.getElementById('record-btn');
  const recordNote    = document.getElementById('record-note');
  const recIndicator  = document.getElementById('rec-indicator');
  const bgLayer       = document.getElementById('bg-layer');
  const vignette      = document.getElementById('vignette');
  const phoneWrap     = document.getElementById('phone-wrap');
  const phone         = document.getElementById('phone');
  const screenImg     = document.getElementById('screen-img');
  const screenVideo   = document.getElementById('screen-video');

  let bgData = null;
  let screenData = null;
  let baseScale = 1;
  let screenIsVideo = false;

  // Preloaded Image for recording canvas
  let bgImg = null;

  function loadBgImg(src) {
    if (!src) { bgImg = null; return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { bgImg = img; };
    img.src = src;
  }

  function calcBaseScale() {
    const story = document.getElementById('story');
    const storyW = story.offsetWidth;
    const storyH = story.offsetHeight;
    const phoneH = phone.offsetHeight || 436;
    const byW = (storyW * 0.57) / 212;
    const byH = (storyH * 0.88) / phoneH;
    baseScale = Math.min(1, byW, byH);
  }

  function applyPhoneScale() {
    const user = parseInt(scaleSlider.value) / 100;
    phoneWrap.style.transform = `scale(${baseScale * user})`;
  }

  calcBaseScale();
  applyPhoneScale();
  window.addEventListener('resize', () => { calcBaseScale(); applyPhoneScale(); });

  /* ── helpers ── */
  function readFile(file, cb) {
    const r = new FileReader();
    r.onload = e => cb(e.target.result);
    r.readAsDataURL(file);
  }

  /* ── Background ── */
  function applyBg() {
    const src = bgData || bgUrl.value.trim();
    if (!src) return;
    bgLayer.style.backgroundImage = `url(${JSON.stringify(src)})`;
    const b = parseInt(blurSlider.value);
    bgLayer.style.filter    = b > 0 ? `blur(${b}px)` : '';
    bgLayer.style.transform = b > 0 ? 'scale(1.08) translate(-3.6%, -3.6%)' : '';
    loadBgImg(src);
  }

  bgFile.addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    readFile(f, data => {
      bgData = data;
      bgUrl.value = '';
      bgFileLabel.textContent = f.name;
      applyBg();
    });
  });

  bgUrl.addEventListener('change', () => {
    if (bgUrl.value.trim()) { bgData = null; bgFileLabel.textContent = 'Upload image…'; }
    applyBg();
  });

  blurSlider.addEventListener('input', () => {
    blurVal.textContent = blurSlider.value + 'px';
    applyBg();
  });

  vigSlider.addEventListener('input', () => {
    vigVal.textContent = vigSlider.value + '%';
    vignette.style.opacity = vigSlider.value / 100;
  });

  /* ── Screenshot / Video ── */
  const PHONE_PAD = 10;
  const SCREEN_W  = 202;

  function resizePhoneToContent(naturalW, naturalH) {
    const screenH  = Math.round(SCREEN_W * naturalH / naturalW);
    const phoneH   = screenH + PHONE_PAD;
    const rOuter   = Math.round(Math.min(40, phoneH * 0.091));
    const rInner   = Math.round(Math.min(36, screenH * 0.087));

    document.documentElement.style.setProperty('--phone-h', phoneH + 'px');
    document.querySelector('.screen').style.borderRadius = rInner + 'px';
    phone.style.borderRadius = rOuter + 'px';
  }

  function applyScreen() {
    const src = screenData || screenUrl.value.trim();
    if (!src) return;

    if (screenIsVideo) {
      screenImg.style.display = 'none';
      screenVideo.style.display = 'none';
      screenVideo.onloadedmetadata = () => {
        resizePhoneToContent(screenVideo.videoWidth, screenVideo.videoHeight);
        screenVideo.style.display = 'block';
        calcBaseScale();
        applyPhoneScale();
        enableRecording();
      };
      screenVideo.src = src;
      screenVideo.load();
      screenVideo.play().catch(() => {});
    } else {
      screenVideo.style.display = 'none';
      screenVideo.src = '';
      screenImg.style.display = 'none';
      screenImg.onload = () => {
        resizePhoneToContent(screenImg.naturalWidth, screenImg.naturalHeight);
        screenImg.style.display = 'block';
        calcBaseScale();
        applyPhoneScale();
      };
      screenImg.onerror = () => { screenImg.style.display = 'none'; };
      screenImg.src = src;
      disableRecording();
    }
  }

  function enableRecording() {
    recordBtn.disabled = false;
    const dur = isFinite(screenVideo.duration) ? ` (~${Math.round(screenVideo.duration)}s)` : '';
    recordNote.textContent = `Records one loop of the video${dur} and exports as WebM at 1080 × 1920.`;
  }

  function disableRecording() {
    recordBtn.disabled = true;
    recordNote.textContent = 'Upload a video to the phone screen to enable recording. Exports as WebM at 1080 × 1920.';
  }

  screenFile.addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    screenIsVideo = f.type.startsWith('video/');
    readFile(f, data => {
      screenData = data;
      screenUrl.value = '';
      screenLabel.textContent = f.name;
      applyScreen();
    });
  });

  screenUrl.addEventListener('change', () => {
    if (screenUrl.value.trim()) {
      screenData = null;
      screenIsVideo = false;
      screenLabel.textContent = 'Upload image or video…';
    }
    applyScreen();
  });

  /* ── Scale ── */
  scaleSlider.addEventListener('input', () => {
    scaleVal.textContent = scaleSlider.value + '%';
    applyPhoneScale();
  });

  /* ── Color ── */
  document.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      phone.className = 'phone ' + sw.dataset.color;
    });
  });

  /* ── Apply ── */
  applyBtn.addEventListener('click', () => {
    applyBg();
    applyScreen();
  });

  [bgUrl, screenUrl].forEach(inp =>
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') applyBtn.click(); })
  );

  /* ── Download PNG ── */
  dlBtn.addEventListener('click', async () => {
    dlBtn.textContent = 'Capturing…';
    dlBtn.disabled = true;
    try {
      const canvas = await html2canvas(document.getElementById('story'), {
        scale: 3,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#000000',
        logging: false,
      });
      const link = document.createElement('a');
      link.download = 'story.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (err) {
      console.error(err);
      alert('Export failed: ' + err.message);
    } finally {
      dlBtn.textContent = '⬇ Download PNG';
      dlBtn.disabled = false;
    }
  });

  /* ────────────────────────────────────────────────
     VIDEO RECORDING
  ──────────────────────────────────────────────── */

  const REC_W = 1080;
  const REC_H = 1920;

  const recordCanvas = document.createElement('canvas');
  recordCanvas.width  = REC_W;
  recordCanvas.height = REC_H;
  const rCtx = recordCanvas.getContext('2d');

  let mediaRecorder = null;
  let recordedChunks = [];
  let rafId = null;
  let isRecording = false;

  const PHONE_COLORS = {
    black: { stops: [['#2a2a2c', 0], ['#181818', 0.6], ['#252527', 1]], btn: '#232325' },
    white: { stops: [['#f5f5f7', 0], ['#e2e2e5', 0.6], ['#f0f0f2', 1]], btn: '#c8c8cc' },
    teal:  { stops: [['#6ecfcf', 0], ['#3a9898', 0.6], ['#5ababa', 1]], btn: '#2e8080' },
    pink:  { stops: [['#f2b8c6', 0], ['#d4728a', 0.6], ['#e8a0b4', 1]], btn: '#c0607a' },
  };

  function rrect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawRecordFrame() {
    const W = REC_W;
    const H = REC_H;

    // Background
    rCtx.fillStyle = '#111';
    rCtx.fillRect(0, 0, W, H);

    if (bgImg) {
      const blurPx = parseInt(blurSlider.value);
      rCtx.save();
      if (blurPx > 0) {
        const scaled = blurPx * (W / 370);
        rCtx.filter = `blur(${scaled}px)`;
      }
      const aspect = bgImg.naturalWidth / bgImg.naturalHeight;
      const canvasAspect = W / H;
      let dw, dh, dx, dy;
      const overshoot = blurPx > 0 ? 0.1 : 0;
      if (aspect > canvasAspect) {
        dh = H * (1 + overshoot * 2);
        dw = dh * aspect;
      } else {
        dw = W * (1 + overshoot * 2);
        dh = dw / aspect;
      }
      dx = (W - dw) / 2;
      dy = (H - dh) / 2;
      rCtx.drawImage(bgImg, dx, dy, dw, dh);
      rCtx.filter = 'none';
      rCtx.restore();
    }

    // Vignette
    const vigOpacity = parseInt(vigSlider.value) / 100;
    if (vigOpacity > 0) {
      const vg = rCtx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
      vg.addColorStop(0.35, 'rgba(0,0,0,0)');
      vg.addColorStop(1, `rgba(0,0,0,${(vigOpacity * 0.55).toFixed(3)})`);
      rCtx.fillStyle = vg;
      rCtx.fillRect(0, 0, W, H);
    }

    // Determine phone geometry
    const colorName = phone.className.replace('phone ', '').trim();
    const colorDef  = PHONE_COLORS[colorName] || PHONE_COLORS.black;

    const vid = screenVideo;
    const hasVideo = vid && vid.readyState >= 2 && vid.videoWidth;
    const hasImage = screenImg.naturalWidth > 0;

    let contentW = 0, contentH = 0;
    if (hasVideo)      { contentW = vid.videoWidth;       contentH = vid.videoHeight; }
    else if (hasImage) { contentW = screenImg.naturalWidth; contentH = screenImg.naturalHeight; }

    // Phone base dimensions (1x reference = 212px wide)
    const scaleToCanvas = W / 370; // e.g. 1080/370 ≈ 2.919
    const phoneBaseW = 212 * scaleToCanvas;
    const padBase    = 5  * scaleToCanvas;

    let phoneBaseH, screenBaseW, screenBaseH;
    if (contentW && contentH) {
      screenBaseW = phoneBaseW - padBase * 2;
      screenBaseH = screenBaseW * contentH / contentW;
      phoneBaseH  = screenBaseH + padBase * 2;
    } else {
      phoneBaseH  = 447 * scaleToCanvas;
      screenBaseW = phoneBaseW - padBase * 2;
      screenBaseH = phoneBaseH - padBase * 2;
    }

    const userScale  = parseInt(scaleSlider.value) / 100;
    const byW        = (W * 0.57) / phoneBaseW;
    const byH        = (H * 0.88) / phoneBaseH;
    const bScale     = Math.min(1, byW, byH);
    const totalScale = bScale * userScale;

    const phoneW  = phoneBaseW  * totalScale;
    const phoneH  = phoneBaseH  * totalScale;
    const screenW = screenBaseW * totalScale;
    const screenH = screenBaseH * totalScale;
    const pad     = padBase     * totalScale;
    const btnW    = 3 * scaleToCanvas * totalScale;

    const phoneX  = (W - phoneW) / 2;
    const phoneY  = (H - phoneH) / 2;
    const screenX = phoneX + pad;
    const screenY = phoneY + pad;

    const outerR = Math.min(40 * scaleToCanvas * totalScale, phoneH * 0.091);
    const innerR = Math.min(36 * scaleToCanvas * totalScale, screenH * 0.087);

    // Phone body gradient
    const g = rCtx.createLinearGradient(phoneX, phoneY, phoneX + phoneW * 0.5, phoneY + phoneH);
    colorDef.stops.forEach(([c, t]) => g.addColorStop(t, c));

    rrect(rCtx, phoneX, phoneY, phoneW, phoneH, outerR);
    rCtx.fillStyle = g;
    rCtx.fill();

    // Outer ring highlight
    rrect(rCtx, phoneX, phoneY, phoneW, phoneH, outerR);
    rCtx.strokeStyle = 'rgba(255,255,255,0.12)';
    rCtx.lineWidth = 1.5;
    rCtx.stroke();

    // Side buttons
    rCtx.fillStyle = colorDef.btn;
    const btnRadius = btnW / 2;

    function drawBtn(bx, by, bw, bh) {
      rCtx.beginPath();
      rCtx.rect(bx, by, bw, bh);
      rCtx.fill();
    }

    // Left: action, vol+, vol-
    drawBtn(phoneX - btnW, phoneY + phoneH * 0.156, btnW, phoneH * 0.037);
    drawBtn(phoneX - btnW, phoneY + phoneH * 0.229, btnW, phoneH * 0.101);
    drawBtn(phoneX - btnW, phoneY + phoneH * 0.353, btnW, phoneH * 0.101);
    // Right: power, camera
    drawBtn(phoneX + phoneW, phoneY + phoneH * 0.257, btnW, phoneH * 0.142);
    drawBtn(phoneX + phoneW, phoneY + phoneH * 0.546, btnW, phoneH * 0.083);

    // Screen content
    rCtx.save();
    rrect(rCtx, screenX, screenY, screenW, screenH, innerR);
    rCtx.clip();

    rCtx.fillStyle = '#000';
    rCtx.fillRect(screenX, screenY, screenW, screenH);

    if (hasVideo) {
      rCtx.drawImage(vid, screenX, screenY, screenW, screenH);
    } else if (hasImage) {
      rCtx.drawImage(screenImg, screenX, screenY, screenW, screenH);
    }

    // Screen glare
    const gl = rCtx.createLinearGradient(screenX, screenY, screenX + screenW * 0.7, screenY + screenH * 0.45);
    gl.addColorStop(0, 'rgba(255,255,255,0.06)');
    gl.addColorStop(1, 'rgba(255,255,255,0)');
    rCtx.fillStyle = gl;
    rCtx.fillRect(screenX, screenY, screenW, screenH);

    // Home bar
    const hbW = 72 * scaleToCanvas * totalScale;
    const hbH = 4  * scaleToCanvas * totalScale;
    const hbX = screenX + (screenW - hbW) / 2;
    const hbY = screenY + screenH - 7 * scaleToCanvas * totalScale - hbH;
    rCtx.fillStyle = 'rgba(255,255,255,0.28)';
    rrect(rCtx, hbX, hbY, hbW, hbH, hbH / 2);
    rCtx.fill();

    rCtx.restore();
  }

  function startRecording() {
    recordedChunks = [];

    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? 'video/webm;codecs=vp9'
      : 'video/webm';

    const stream = recordCanvas.captureStream(30);
    mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });

    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      isRecording = false;
      cancelAnimationFrame(rafId);
      rafId = null;

      // Restore video state
      screenVideo.loop = true;
      screenVideo.play().catch(() => {});

      recIndicator.classList.remove('visible');
      recordBtn.textContent = '⏺ Record Video';
      recordBtn.className = 'btn btn-record';
      recordBtn.disabled = false;

      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.download = 'story.webm';
      a.href = url;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    };

    // Play video once (no loop) and auto-stop when it ends
    screenVideo.loop = false;
    screenVideo.currentTime = 0;
    screenVideo.play().catch(() => {});

    const duration = isFinite(screenVideo.duration) ? screenVideo.duration : null;
    let stopTimeout = null;

    screenVideo.onended = () => {
      if (isRecording) stopRecording();
    };

    if (duration) {
      stopTimeout = setTimeout(() => {
        if (isRecording) stopRecording();
      }, (duration + 0.5) * 1000);
    }

    // Render loop
    function loop() {
      drawRecordFrame();
      rafId = requestAnimationFrame(loop);
    }
    loop();

    mediaRecorder.start(100); // collect data every 100ms
    isRecording = true;

    recIndicator.classList.add('visible');
    recordBtn.textContent = '⏹ Stop';
    recordBtn.className = 'btn btn-stop';
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
    }
  }

  recordBtn.addEventListener('click', () => {
    if (isRecording) {
      stopRecording();
    } else {
      startRecording();
    }
  });
</script>
</body>
</html>
